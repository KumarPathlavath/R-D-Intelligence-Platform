[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "continuous-technology-intelligence-engine"
version = "1.0.0"
description = "Signal-to-Opportunity: An Evidence-Backed R&D Intelligence Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "R&D Intelligence Team" }
]
dependencies = [
    "sentence-transformers>=2.2.0",
    "chromadb>=0.4.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.31.0",
    "feedparser>=6.0.10",
    "python-dotenv>=1.0.0",
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "plotly>=5.18.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "pytest>=7.4.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
